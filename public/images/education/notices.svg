    <linearGradient id="ntcBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF3E6"/><stop offset="1" stop-color="#F1EDFF"/>
    </linearGradient>
    <linearGradient id="ntcHorn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDAB3D"/><stop offset="1" stop-color="#F08700"/>
