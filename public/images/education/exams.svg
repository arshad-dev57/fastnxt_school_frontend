<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="Exams and results illustration">
  <defs>
    <linearGradient id="exmBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EAF7F0"/><stop offset="1" stop-color="#E9F1FF"/>
    </linearGradient>
    <linearGradient id="exmGrade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00C875"/><stop offset="1" stop-color="#00A863"/>
    </linearGradient>
  </defs>

  <rect width="320" height="200" rx="22" fill="url(#exmBg)"/>
  <circle cx="286" cy="46" r="26" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="34" cy="164" r="18" fill="#FFFFFF" opacity="0.6"/>

  <!-- answer sheet -->
  <rect x="40" y="34" width="140" height="132" rx="12" fill="#FFFFFF" stroke="#E1E6F0" stroke-width="2"/>
  <rect x="58" y="52" width="70" height="9" rx="4.5" fill="#2563EB" opacity="0.9"/>
  <rect x="58" y="70" width="104" height="7" rx="3.5" fill="#E6E9EF"/>
  <rect x="58" y="84" width="92" height="7" rx="3.5" fill="#E6E9EF"/>

  <g fill="none" stroke="#00C875" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M52 108l6 7 12-13"/>
    <path d="M52 130l6 7 12-13"/>
    <path d="M52 152l6 7 12-13"/>
  </g>
  <g fill="#E6E9EF">
    <rect x="80" y="107" width="80" height="8" rx="4"/>
    <rect x="80" y="129" width="64" height="8" rx="4"/>
    <rect x="80" y="151" width="72" height="8" rx="4"/>
  </g>

  <!-- grade badge -->
  <circle cx="228" cy="92" r="46" fill="#FFFFFF" stroke="#E1E6F0" stroke-width="2"/>
  <circle cx="228" cy="92" r="34" fill="url(#exmGrade)"/>
  <text x="228" y="103" text-anchor="middle" font-family="Figtree, Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF">A+</text>

  <!-- pencil -->
  <g transform="rotate(38 254 152)">
    <rect x="236" y="140" width="36" height="14" rx="4" fill="#FDAB3D"/>
    <path d="M236 140l-16 7 16 7z" fill="#F6E3CF"/>
    <path d="M220 147l6 3-6 3z" fill="#292F4C"/>
    <rect x="270" y="140" width="12" height="14" rx="4" fill="#DF2F4A"/>
  </g>
</svg>
